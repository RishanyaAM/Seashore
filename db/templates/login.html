<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

</head>
<style>
    /* General styles for the body */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #e0f7fa; /* Light sea-blue background */
}

/* Header styling with a sea theme */
header {
    background-color: #006064; /* Deep sea-blue */
    color: white;
    padding: 20px 0;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 2px;
    font-weight: bold;
}

header p {
    margin-top: 5px;
    font-size: 16px;
}

/* Container styling */
.container {
    text-align: center;
    margin-top: 50px;
}

.container h1 {
    font-size: 24px;
    margin-bottom: 20px;
    color: #004d40; /* Dark teal */
}

/* Form styling */
form {
    max-width: 400px;
    margin: 0 auto;
    padding: 30px;
    background-color: #ffffff; /* White background for form */
    border: 1px solid #ccc;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); /* Slight shadow for a modern look */
}

/* Style the labels */
label {
    display: block;
    margin-bottom: 10px;
    font-weight: bold;
    font-size: 16px;
    color: #004d40; /* Dark teal */
}

/* Style the input fields */
input[type="text"],
input[type="password"] {
    width: 100%;
    padding: 12px 15px;
    margin-bottom: 20px;
    border: 1px solid #b0bec5; /* Soft blue-gray border */
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 14px;
    background-color: #e0f2f1; /* Light aqua for input background */
    transition: border-color 0.3s ease;
}

/* Input hover and focus effects */
input[type="text"]:focus,
input[type="password"]:focus {
    border-color: #004d40; /* Darker teal border on focus */
    outline: none;
    box-shadow: 0 0 5px rgba(0, 77, 64, 0.3); /* Soft shadow on focus */
}

/* Style the submit button */
button[type="submit"] {
    width: 100%;
    padding: 12px;
    background-color: #00796b; /* Sea-green button */
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: background-color 0.3s ease;
}

/* Button hover effect */
button[type="submit"]:hover {
    background-color: #004d40; /* Darker sea-green on hover */
}

/* Optional: Add a little animation to the form on page load */
form {
    opacity: 0;
    animation: fadeIn 1s ease-in-out forwards;
}

@keyframes fadeIn {
    to {
        opacity: 1;
    }
}

</style>
<body>
    <header>
        <h1>SEA SHORE</h1>
        <p>Manage your fleet effortlessly</p>
    </header>
    <div class="container">
    <h1>Login</h1>
    <form method="POST" action="{{ url_for('login') }}">
        <label for="sailor_id">Sailor ID:</label>
        <input type="text" name="sailor_id" required><br>
        <label for="password">Password:</label>
        <input type="password" name="password" required><br>
        <button type="submit">Login</button>
    </form>
    </div>
    <p>{{ get_flashed_messages()[0] }}</p>
    
</body>
</html>
